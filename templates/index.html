<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 95%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎬 YouTube Downloader</h2>
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="Вставь ссылку на видео..." required>
            <button type="submit">Скачать видео</button>
        </form>
    </div>
</body>
</html>
